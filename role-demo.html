<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Transparență Edu — Roluri</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#f3f6fa;color:#152238}.top{background:#173f73;color:white;padding:22px}.wrap{max-width:760px;margin:auto;padding:15px}.card{background:white;padding:16px;border-radius:18px;margin:12px 0;box-shadow:0 3px 15px #102a4412}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.btn{border:0;border-radius:12px;padding:12px;background:#1764a7;color:white;font-weight:750}.light{background:#e7f0fa;color:#14558d}.ok{background:#16834c}.no{background:#a93c3c}.field{width:100%;padding:12px;border:1px solid #dbe2ea;border-radius:12px;margin:6px 0}.pill{display:inline-block;padding:5px 8px;border-radius:99px;background:#e5f6ec;color:#147244;font-size:11px;font-weight:800}.row{padding:12px 0;border-top:1px solid #edf0f4}.muted{font-size:13px;color:#697689}.warn{padding:12px;background:#fff5df;border-radius:12px}</style></head><body><header class="top"><h1>🇷🇴 Transparență Edu</h1><div>Demo roluri și aprobări</div></header><main class="wrap"><div class="card"><h2>Cu ce rol testezi aplicația?</h2><div class="grid"><button class="btn role" data-role="director">🏫 Director</button><button class="btn role" data-role="homeroom">👩‍🏫 Diriginte</button><button class="btn role" data-role="teacher">📚 Profesor</button><button class="btn role" data-role="student">🎒 Elev</button><button class="btn role" data-role="parent">👪 Părinte</button></div><p class="muted">Demo local. Rolurile privilegiate vor necesita verificare în versiunea reală.</p></div><div id="panel"></div><div class="card"><button class="btn light" onclick="location.href='community.html'">← Comunitatea școlii</button></div></main><script>const $=x=>document.getElementById(x),esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const K='eduApprovalDemo';function data(){let d=JSON.parse(localStorage.getItem(K)||'{"schools":[],"classes":[],"teachers":[],"requests":[]}');d.requests=d.requests||[];d.classes=d.classes||[];return d}function save(d){localStorage.setItem(K,JSON.stringify(d))}function input(id,p){return `<input id="${id}" class="field" placeholder="${p}">`}document.querySelectorAll('.role').forEach(b=>b.onclick=()=>render(b.dataset.role));function render(role){let d=data(),p=$('panel');if(role==='director'){p.innerHTML=`<div class="card"><span class="pill">DIRECTOR · NECESITĂ VERIFICARE</span><h2>Administrarea școlii</h2>${input('school','Numele școlii')}<button id="mkSchool" class="btn">Creează / activează școala</button>${input('class','Clasa, ex. VIII B')}<button id="mkClass" class="btn">+ Creează clasa</button>${input('prof','Nume profesor')}<button id="mkProf" class="btn">+ Invită profesor</button>${input('dir','Nume diriginte')}${input('dirClass','Clasa dirigintelui')}<button id="setDir" class="btn">Atribuie diriginte clasei</button><div class="warn">Același diriginte poate fi atribuit mai multor clase, dacă Directorul autorizează acest lucru.</div><div id="summary"></div></div>`;function summary(){$('summary').innerHTML=`<h3>Configurare demo</h3>${d.schools.map(x=>`<div class="row">🏫 ${esc(x)}</div>`).join('')}${d.classes.map(x=>`<div class="row">🎓 ${esc(x.name)} ${x.diriginte?'· Diriginte: '+esc(x.diriginte):''}</div>`).join('')}${d.teachers.map(x=>`<div class="row">📚 ${esc(x)}</div>`).join('')}`}$('mkSchool').onclick=()=>{let v=$('school').value.trim();if(v){d.schools.push(v);save(d);summary()}};$('mkClass').onclick=()=>{let v=$('class').value.trim();if(v){d.classes.push({name:v,diriginte:''});save(d);summary()}};$('mkProf').onclick=()=>{let v=$('prof').value.trim();if(v){d.teachers.push(v);save(d);summary()}};$('setDir').onclick=()=>{let n=$('dir').value.trim(),c=$('dirClass').value.trim(),x=d.classes.find(x=>x.name.toLowerCase()===c.toLowerCase());if(n&&x){x.diriginte=n;save(d);summary()}else alert('Clasa nu există încă.')};summary();return}if(role==='student'){p.innerHTML=`<div class="card"><span class="pill">ELEV</span><h2>Cerere de înscriere</h2>${input('name','Numele elevului')}${input('cl','Clasa dorită')}<button id="send" class="btn">Trimite cererea dirigintelui</button><div class="warn">Elevul intră în clasă numai după aprobarea dirigintelui.</div></div>`;$('send').onclick=()=>{let n=$('name').value.trim(),c=$('cl').value.trim();if(n&&c){d.requests.push({id:Date.now(),type:'student',name:n,className:c,status:'pending'});save(d);alert('Cerere trimisă.')}};return}if(role==='parent'){let parent='';function screen(){let links=d.requests.filter(x=>x.type==='parent'&&(!parent||x.name.toLowerCase()===parent.toLowerCase()));p.innerHTML=`<div class="card"><span class="pill">PĂRINTE / TUTORE</span><h2>Copiii mei</h2>${input('parent','Numele părintelui')}${input('child','Numele copilului')}${input('cl','Clasa copilului')}<button id="send" class="btn">+ Adaugă cerere pentru copil</button><div class="warn">Un părinte poate avea mai mulți copii, inclusiv în aceeași clasă. Fiecare legătură Părinte ↔ Elev se aprobă separat.</div><div id="kids">${links.map(x=>`<div class="row">👪 ${esc(x.name)} → 🎒 <b>${esc(x.child)}</b> · ${esc(x.className)} <span class="pill">${esc(x.status)}</span></div>`).join('')}</div></div>`;$('send').onclick=()=>{let n=$('parent').value.trim(),ch=$('child').value.trim(),c=$('cl').value.trim();if(n&&ch&&c){parent=n;let exists=d.requests.some(x=>x.type==='parent'&&x.name.toLowerCase()===n.toLowerCase()&&x.child.toLowerCase()===ch.toLowerCase()&&x.className.toLowerCase()===c.toLowerCase()&&x.status!=='rejected');if(exists)return alert('Există deja o cerere pentru această legătură.');d.requests.push({id:Date.now(),type:'parent',name:n,child:ch,className:c,status:'pending'});save(d);screen()}}}screen();return}if(role==='homeroom'){let assigned=[...new Set(d.classes.filter(x=>x.diriginte).map(x=>x.diriginte))];let req=d.requests.filter(x=>x.status==='pending');p.innerHTML=`<div class="card"><span class="pill">DIRIGINTE · ATRIBUIT DE DIRECTOR</span><h2>Clase și cereri</h2><div class="warn">Un diriginte poate gestiona mai mulți elevi și, dacă Directorul îl atribuie, mai multe clase.</div>${assigned.length?'<p class="muted">Diriginți configurați: '+assigned.map(esc).join(', ')+'</p>':''}${req.length?req.map(x=>`<div class="row"><b>${x.type==='student'?'🎒 Înscriere elev':'👪 Asociere părinte'}</b><div>${esc(x.name)}${x.child?' → '+esc(x.child):''} · Clasa ${esc(x.className)}</div><p><button class="btn ok act" data-id="${x.id}" data-v="approved">Acceptă</button> <button class="btn no act" data-id="${x.id}" data-v="rejected">Respinge</button></p></div>`).join(''):'<p class="muted">Nu există cereri în așteptare.</p>'}</div>`;document.querySelectorAll('.act').forEach(b=>b.onclick=()=>{let x=d.requests.find(x=>x.id==b.dataset.id);if(x){x.status=b.dataset.v;save(d);render('homeroom')}});return}p.innerHTML=`<div class="card"><span class="pill">PROFESOR · INVITAT DE DIRECTOR</span><h2>Clase și materii atribuite</h2><p>Profesorul vede numai clasele și materiile atribuite de școală.</p></div>`}</script></body></html>
