<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173f73"><link rel="manifest" href="manifest.json"><title>Transparență Edu — Comunitatea școlii</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#f3f6fa;color:#152238}.top{background:linear-gradient(135deg,#123b6c,#1670b9);color:#fff;padding:22px 18px;border-radius:0 0 26px 26px}.top h1{margin:0;font-size:25px}.top p{margin:6px 0 0;opacity:.9}.wrap{max-width:800px;margin:auto;padding:15px}.card{background:#fff;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 3px 15px #102a4412}.btn{border:0;background:#1764a7;color:#fff;border-radius:12px;padding:12px 14px;font-weight:750}.btn2{border:0;background:#e7f0fa;color:#14558d;border-radius:11px;padding:10px 12px;font-weight:700}.field{width:100%;border:1px solid #dbe2ea;border-radius:12px;padding:12px;margin:6px 0 10px;font:inherit}.muted{font-size:13px;color:#697689}.tag,.pill{display:inline-block;background:#e5f6ec;color:#147244;border-radius:99px;padding:5px 8px;font-size:11px;font-weight:800;margin-right:4px}.warn{background:#fff5df;border-radius:13px;padding:12px;font-size:13px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.tile{border:0;background:#fff;border-radius:16px;padding:16px 8px;box-shadow:0 3px 15px #102a4412;text-align:center;font-weight:750}.tile span{display:block;font-size:27px;margin-bottom:4px}.hide{display:none}.post,.member,.row{border-top:1px solid #edf0f4;padding:12px 0}.row:first-child,.member:first-child,.post:first-child{border-top:0}.nav{position:sticky;bottom:8px;background:#fff;border-radius:18px;display:flex;justify-content:space-around;padding:9px;box-shadow:0 7px 25px #102a4430;margin-top:20px}.nav button{border:0;background:none;font-size:12px}.nav span{display:block;font-size:20px}.role{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:10px 0}.role button{padding:10px 4px;border:1px solid #dce5ef;background:#fff;border-radius:11px}.classRow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 0;border-top:1px solid #edf0f4}.classRow:first-child{border:0}.count{font-size:12px;color:#697689}.actions{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0}.day{font-weight:800;color:#14558d;margin-top:12px}</style></head><body><header class="top"><h1>🇷🇴 Transparență Edu</h1><p>Școală → Clasă → Comunitate și organizare</p></header><main class="wrap"><section id="choose"><div class="card"><h2>🏫 Alege școala ta</h2><input id="school" class="field" list="schools" placeholder="Caută școala, localitatea sau județul…"><datalist id="schools"></datalist><button id="enter" class="btn">Intră în școală</button></div><div class="warn">🛡️ Membrii claselor sunt privați. Datele demo rămân numai pe dispozitiv.</div></section><section id="home" class="hide"><div class="card"><span class="tag">ȘCOALA MEA</span><h2 id="schoolName"></h2><button id="change" class="btn2">Schimbă școala</button></div><div class="card"><h3>🏫 Clasele școlii</h3><div id="classes"></div><button id="addClass" class="btn">+ Adaugă clasă</button></div><div class="grid"><button class="tile" data-view="discussions"><span>💬</span>Școala</button><button class="tile" data-view="polls"><span>📊</span>Sondaje</button><button class="tile" data-view="ideas"><span>💡</span>Idei</button><button class="tile" data-view="help"><span>🤝</span>Cere ajutor</button></div></section><section id="classView" class="hide"><button id="classBack" class="btn2">← Clase</button><div class="card"><span class="tag">CLASA MEA</span><h2 id="className"></h2><div id="classCounts" class="muted"></div></div><div class="grid"><button class="tile" id="membersBtn"><span>👥</span>Membri</button><button class="tile" data-class="subjects"><span>📚</span>Materii</button><button class="tile" data-class="schedule"><span>🕘</span>Orar</button><button class="tile" data-class="homework"><span>📝</span>Teme</button><button class="tile" data-class="calendar"><span>📅</span>Calendar</button><button class="tile" data-class="chat"><span>💬</span>Comunitate</button><button class="tile" data-class="poll"><span>📊</span>Sondaje</button><button class="tile" data-class="ann"><span>📢</span>Anunțuri</button></div><div id="classPanel"></div></section><section id="view" class="hide"><button id="back" class="btn2">← Comunitate</button><div class="card"><h2 id="viewTitle"></h2><div id="composer"></div><div id="feed"></div></div></section><nav class="nav"><button id="navHome"><span>⌂</span>Acasă</button><button data-quick="discussions"><span>💬</span>Școală</button><button data-quick="polls"><span>📊</span>Sondaje</button><button data-quick="help"><span>🤝</span>Ajutor</button></nav></main><script>const $=x=>document.getElementById(x),esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let schools=[],selected=JSON.parse(localStorage.getItem('eduSchool')||'null'),currentClass=null;const labels={discussions:'💬 Comunitatea școlii',polls:'📊 Sondaje',ideas:'💡 Idei pentru școală',help:'🤝 Cere ajutor'};function hideAll(){['choose','home','classView','view'].forEach(x=>$(x).classList.add('hide'))}async function init(){try{let d=await fetch('./data/schools.json').then(r=>r.json());schools=d.schools||[];let f=document.createDocumentFragment();schools.slice(0,9000).forEach(s=>{let o=document.createElement('option');o.value=[s.name,s.locality,s.county].filter(Boolean).join(' — ');f.appendChild(o)});$('schools').appendChild(f)}catch(e){}if(selected)showHome()}function findSchool(v){return schools.find(s=>[s.name,s.locality,s.county].filter(Boolean).join(' — ')===v)||schools.find(s=>s.name===v)}function classKey(){return'eduClasses:'+selected.id}function getClasses(){return JSON.parse(localStorage.getItem(classKey())||'[]')}function saveClasses(a){localStorage.setItem(classKey(),JSON.stringify(a))}function ensure(c){c.students=c.students||[];c.parents=c.parents||[];c.teacher=c.teacher||'';c.subjects=c.subjects||[];c.schedule=c.schedule||[];c.homework=c.homework||[];c.calendar=c.calendar||[];return c}function showHome(){if(!selected)return;hideAll();$('home').classList.remove('hide');$('schoolName').textContent=selected.name+' · '+(selected.locality||selected.county||'');renderClasses()}function renderClasses(){let a=getClasses();$('classes').innerHTML=a.length?a.map((c,i)=>{c=ensure(c);return`<div class="classRow"><div><b>Clasa ${esc(c.name)}</b><div class="count">🎒 ${c.students.length} elevi · 👪 ${c.parents.length} părinți · 🏫 ${c.teacher?'1 diriginte':'fără diriginte'}</div></div><button class="btn2 openClass" data-i="${i}">Deschide</button></div>`}).join(''):'<p class="muted">Nu există clase configurate încă.</p>';document.querySelectorAll('.openClass').forEach(b=>b.onclick=()=>openClass(+b.dataset.i))}$('addClass').onclick=()=>{let n=prompt('Numele clasei (ex.: VIII B):');if(!n)return;let a=getClasses();a.push(ensure({id:Date.now().toString(),name:n.trim()}));saveClasses(a);renderClasses()};function getCurrent(){let a=getClasses(),c=ensure(a[currentClass]);a[currentClass]=c;return[a,c]}function persist(a,c){a[currentClass]=c;saveClasses(a)}function openClass(i){currentClass=i;let[a,c]=getCurrent();persist(a,c);hideAll();$('classView').classList.remove('hide');$('className').textContent='Clasa '+c.name;$('classCounts').textContent=`${c.students.length} elevi · ${c.parents.length} părinți · ${c.teacher?'Diriginte: '+c.teacher:'Diriginte nealocat'}`;$('classPanel').innerHTML=''}$('classBack').onclick=showHome;$('membersBtn').onclick=()=>{let[a,c]=getCurrent();$('classPanel').innerHTML=`<div class="card"><h3>👥 Membrii clasei</h3><div class="warn">🔒 Zonă privată pentru membrii autorizați.</div><div class="role"><button id="addStudent">🎒<br>Elev</button><button id="addParent">👪<br>Părinte</button><button id="setTeacher">🏫<br>Diriginte</button></div><div id="memberList"></div></div>`;function r(){$('memberList').innerHTML=c.students.map(x=>`<div class="member">🎒 ${esc(x)}</div>`).concat(c.parents.map(x=>`<div class="member">👪 ${esc(x)}</div>`),c.teacher?[`<div class="member">🏫 <b>${esc(c.teacher)}</b> · Diriginte</div>`]:[]).join('')||'<p class="muted">Niciun membru adăugat.</p>'}$('addStudent').onclick=()=>{let n=prompt('Nume elev (demo privat):');if(n){c.students.push(n.trim());persist(a,c);openClass(currentClass);$('membersBtn').click()}};$('addParent').onclick=()=>{let n=prompt('Nume părinte (demo privat):');if(n){c.parents.push(n.trim());persist(a,c);openClass(currentClass);$('membersBtn').click()}};$('setTeacher').onclick=()=>{let n=prompt('Numele dirigintelui:');if(n){c.teacher=n.trim();persist(a,c);openClass(currentClass);$('membersBtn').click()}};r()};document.querySelectorAll('[data-class]').forEach(b=>b.onclick=()=>classAction(b.dataset.class));function classAction(type){let[a,c]=getCurrent(),p=$('classPanel');if(type==='subjects'){p.innerHTML=`<div class="card"><h3>📚 Materii și profesori</h3><button id="add" class="btn">+ Materie</button>${c.subjects.map(x=>`<div class="row"><b>${esc(x.name)}</b><div class="muted">${esc(x.teacher||'Profesor nealocat')}</div></div>`).join('')}</div>`;$('add').onclick=()=>{let n=prompt('Materia:');if(!n)return;let t=prompt('Profesor (opțional):')||'';c.subjects.push({id:Date.now().toString(),name:n.trim(),teacher:t.trim()});persist(a,c);classAction(type)};return}if(type==='schedule'){p.innerHTML=`<div class="card"><h3>🕘 Orar</h3><button id="add" class="btn">+ Lecție</button>${['Luni','Marți','Miercuri','Joi','Vineri'].map(d=>`<div class="day">${d}</div>${c.schedule.filter(x=>x.day===d).sort((x,y)=>x.time.localeCompare(y.time)).map(x=>`<div class="row"><b>${esc(x.time)}</b> · ${esc(x.subject)}</div>`).join('')||'<div class="muted">—</div>'}`).join('')}</div>`;$('add').onclick=()=>{let d=prompt('Ziua: Luni, Marți, Miercuri, Joi sau Vineri');if(!d)return;let time=prompt('Ora (ex. 08:00):')||'',s=prompt('Materia:');if(!s)return;c.schedule.push({day:d.trim(),time:time.trim(),subject:s.trim()});persist(a,c);classAction(type)};return}if(type==='homework'){p.innerHTML=`<div class="card"><h3>📝 Teme</h3><button id="add" class="btn">+ Temă</button>${c.homework.map(x=>`<div class="row"><b>${esc(x.subject)}</b> · ${esc(x.title)}<div class="muted">Termen: ${esc(x.due||'nespecificat')}</div></div>`).join('')||'<p class="muted">Nu sunt teme.</p>'}</div>`;$('add').onclick=()=>{let s=prompt('Materia:');if(!s)return;let t=prompt('Tema:');if(!t)return;let d=prompt('Termen (AAAA-LL-ZZ):')||'';c.homework.unshift({subject:s.trim(),title:t.trim(),due:d.trim()});persist(a,c);classAction(type)};return}if(type==='calendar'){p.innerHTML=`<div class="card"><h3>📅 Calendarul clasei</h3><button id="add" class="btn">+ Eveniment</button>${c.calendar.sort((x,y)=>x.date.localeCompare(y.date)).map(x=>`<div class="row"><b>${esc(x.date)}</b> · ${esc(x.title)}<div class="muted">${esc(x.kind)}</div></div>`).join('')||'<p class="muted">Nu sunt evenimente.</p>'}</div>`;$('add').onclick=()=>{let d=prompt('Data (AAAA-LL-ZZ):');if(!d)return;let t=prompt('Eveniment:');if(!t)return;let k=prompt('Tip: test / ședință / activitate / altul')||'altul';c.calendar.push({date:d.trim(),title:t.trim(),kind:k.trim()});persist(a,c);classAction(type)};return}let key='eduClass:'+selected.id+':'+c.id+':'+type,items=JSON.parse(localStorage.getItem(key)||'[]'),title=type==='chat'?'💬 Comunitatea clasei':type==='poll'?'📊 Sondajele clasei':'📢 Anunțurile clasei';p.innerHTML=`<div class="card"><h3>${title}</h3><textarea id="classText" class="field" rows="3" placeholder="Scrie un mesaj pentru clasă…"></textarea><button id="classPublish" class="btn">Publică în demo</button>${items.map(x=>`<div class="post"><span class="pill">Membru</span><p>${esc(x.text)}</p></div>`).join('')}</div>`;$('classPublish').onclick=()=>{let t=$('classText').value.trim();if(!t)return;items.unshift({text:t,at:Date.now()});localStorage.setItem(key,JSON.stringify(items.slice(0,100)));classAction(type)}}function openView(type){if(!selected)return;hideAll();$('view').classList.remove('hide');$('viewTitle').textContent=labels[type];let key='school:'+selected.id+':'+type,items=JSON.parse(localStorage.getItem('eduCommunity:'+key)||'[]'),priv=type==='help';$('composer').innerHTML=`${priv?'<div class="warn">🔒 Solicitarea nu apare în feedul public.</div>':''}<textarea id="text" class="field" rows="3" placeholder="Scrie respectuos și fără date personale sensibile…"></textarea><button id="publish" class="btn">${priv?'Trimite solicitarea':'Publică'}</button>`;$('feed').innerHTML=priv?'':items.map(p=>`<div class="post"><span class="pill">Membru</span><p>${esc(p.text)}</p></div>`).join('');$('publish').onclick=()=>{let t=$('text').value.trim();if(!t)return;if(priv){$('composer').innerHTML='<div class="warn">✅ Solicitare salvată doar în demo local.</div>';return}items.unshift({text:t,at:Date.now()});localStorage.setItem('eduCommunity:'+key,JSON.stringify(items));openView(type)}}$('enter').onclick=()=>{let s=findSchool($('school').value);if(!s)return alert('Selectează o școală din listă.');selected={id:s.id,name:s.name,locality:s.locality,county:s.county};localStorage.setItem('eduSchool',JSON.stringify(selected));showHome()};$('change').onclick=()=>{selected=null;localStorage.removeItem('eduSchool');hideAll();$('choose').classList.remove('hide')};$('back').onclick=showHome;$('navHome').onclick=()=>selected?showHome():(hideAll(),$('choose').classList.remove('hide'));document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>openView(b.dataset.view));document.querySelectorAll('[data-quick]').forEach(b=>b.onclick=()=>openView(b.dataset.quick));init();</script></body></html>
