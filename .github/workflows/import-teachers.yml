name: Importă datele profesionale oficiale

# Importul automat din serverele oficiale a fost dezactivat deoarece conexiunile
# din GitHub Actions sunt instabile și pot suprascrie baza verificată manual.
# Workflow-ul rămâne disponibil doar pentru pornire manuală după verificarea sursei.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-teacher-dataset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validează baza verificată
        run: |
          python - <<'PY'
          import json
          d=json.load(open('data/teachers.json',encoding='utf-8'))
          assert d.get('schemaVersion',0) >= 10
          teachers=d.get('teachers',[])
          assert d.get('count') == len(teachers)
          for x in teachers:
              assert x.get('name')
              assert x.get('schoolId')
              assert x.get('schoolNameOfficial')
              assert x.get('schoolLinkStatus') == 'verified-exact-registry-match'
              assert x.get('officialResults')
              for result in x['officialResults']:
                  assert result.get('sourceUrl')
          print('Baza verificată este validă. Total profesori:', len(teachers))
          PY
