name: Importă datele profesionale oficiale
on:
  workflow_dispatch:
  schedule:
    - cron: '40 4 * * 1'
  push:
    branches: [main]
    paths:
      - 'scripts/import_teachers.py'
      - 'data/teacher_sources.json'
      - '.github/workflows/import-teachers.yml'
permissions:
  contents: write
concurrency:
  group: import-teachers
  cancel-in-progress: false
jobs:
  import-teachers:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        batch:
          - 'AB,AR,AG,BC,BH,BN,BT,BV,BR,B'
          - 'BZ,CS,CL,CJ,CT,CV,DB,DJ,GL,GR'
          - 'GJ,HR,HD,IL,IS,IF,MM,MH,MS,NT'
          - 'OT,PH,SM,SJ,SB,SV,TR,TM,TL,VS'
          - 'VL,VN'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sincronizează baza înainte de lot
        run: git pull --rebase origin main
      - name: Importă lotul de județe
        env:
          COUNTY_BATCH: ${{ matrix.batch }}
        run: python -u scripts/import_teachers.py
      - name: Validează lotul
        run: |
          python - <<'PY'
          import json
          d=json.load(open('data/teachers.json',encoding='utf-8'))
          assert d.get('schemaVersion',0)>=6
          assert len(d.get('lastBatch',[])) <= 10
          for x in d.get('teachers',[]):
              assert x.get('name') and x.get('schoolNameOfficial')
              assert x.get('schoolLinkStatus')=='official-placement-unmatched'
          print('Validare OK. Lot:', ', '.join(d.get('lastBatch',[])), 'Total DB:', d.get('count'))
          PY
      - name: Salvează lotul
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/teachers.json
          if git diff --cached --quiet; then
            echo "Nicio modificare."
          else
            git commit -m "Update teacher data batch ${{ matrix.batch }}"
            git pull --rebase origin main
            git push
          fi
